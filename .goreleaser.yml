version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: treehouse
    main: ./cmd/treehouse
    binary: treehouse
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  disable: true

release:
  draft: false
  prerelease: auto
  mode: keep-existing
